<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Siga & Ganhe | Farma & Farma Igarassu</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 38px 25px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.10);
    }

    .presente {
      font-size: 55px;
      margin-bottom: 12px;
    }

    h1 {
      color: #174b8c;
      font-size: 30px;
      margin-bottom: 12px;
    }

    .subtitulo {
      color: #444;
      font-size: 18px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .passos {
      text-align: left;
      background: #f7f9fc;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 28px;
      line-height: 2;
      font-size: 16px;
      color: #333;
    }

    .botao {
      display: block;
      background: #174b8c;
      color: white;
      text-decoration: none;
      padding: 17px 15px;
      border-radius: 14px;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 22px;
    }

    .rodape {
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="presente">🎁</div>

    <h1>SIGA & GANHE!</h1>

    <p class="subtitulo">
      Siga a <strong>Farma & Farma Igarassu</strong><br>
      e ganhe um brinde!
    </p>

    <div class="passos">
      <p>📱 <strong>1.</strong> Siga nosso Instagram</p>
      <p>👀 <strong>2.</strong> Mostre para nossa equipe</p>
      <p>🎁 <strong>3.</strong> Ganhe seu brinde!</p>
    </div>

    <a class="botao"
       href="https://www.instagram.com/farmaefarmaigarassu/"
       target="_blank">
       SEGUIR @FARMAEFARMAIGARASSU
    </a>

    <p class="rodape">
      Farma & Farma Igarassu 💙❤️
    </p>

  </div>

</body>
</html>
